<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e1a26">
  <meta name="description" content="苦瓜大王的数字宇宙入口 —— 信息安全 × AI Agent × 3D 交互">
  <title>苦瓜大王 · 于喧嚣宇宙中寻回澄澈</title>

  <!-- 网站图标（与自我介绍页同款，保持品牌一致） -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23FF005E'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='%23fff' font-family='sans-serif'>苦</text></svg>">

  <!-- 衬线字体：Instrument Serif（拉丁）+ Noto Serif SC（中文），加载失败自动回退系统衬线 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <link rel="stylesheet" href="landing.css">
</head>
<body>
  <section class="stage">

    <!-- 背景层：渐变兜底 + 四段氛围视频（切换由下方脚本驱动） -->
    <div class="bg-videos" aria-hidden="true">
      <div class="bg-fallback"></div>
      <video class="bg-video is-active" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_081127_0992a171-d3c6-4978-8213-0ec5df8b6d63.mp4" autoplay muted loop playsinline preload="auto"></video>
      <video class="bg-video" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_092026_dd05b805-ea0f-40b2-8c52-332b88502592.mp4" muted loop playsinline preload="auto"></video>
      <video class="bg-video" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_081042_df7202bf-bd80-4b2b-bbc6-1f09ba2870e9.mp4" muted loop playsinline preload="auto"></video>
      <video class="bg-video" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_080959_4cac5234-3573-464e-a5b7-76b94b8a7d61.mp4" muted loop playsinline preload="auto"></video>
    </div>

    <!-- 车窗贴图：透明 PNG 覆盖层，带着轻微的浮动呼吸感 -->
    <img class="train-overlay train-bob" src="assets/train-overlay.png" alt="" draggable="false">

    <!-- 内容层 -->
    <div class="content" id="content">

      <!-- 顶部导航 -->
      <nav class="nav">
        <span class="logo">苦瓜大王</span>
        <div class="nav-pill liquid-glass">
          <a class="nav-link" href="./intro/#projects">项目</a>
          <a class="nav-link" href="./intro/#timeline">经历</a>
          <a class="nav-link" href="./intro/#honors">荣誉</a>
          <a class="nav-link" href="./intro/#contact">联系我</a>
          <a class="nav-cta" href="./intro/">进入自我介绍 →</a>
        </div>
      </nav>

      <!-- 主视觉文案 -->
      <div class="hero">
        <div class="badge liquid-glass swap-color">信息安全 × AI Agent × 3D 交互</div>

        <h1 class="title swap-color">
          于喧嚣的赛博宇宙中<br>搭建自己的澄澈角落
        </h1>

        <p class="desc swap-color">
          这里是苦瓜大王的数字基地：一个喜欢把奇思妙想变成工具的信息安全专业学生。
          准备好了就推开车门，进来看看。
        </p>

        <div class="cta-row">
          <a class="cta-primary" href="./intro/">✦ 进入我的自我介绍</a>
          <a class="cta-ghost liquid-glass" href="./intro/#projects">先逛逛作品</a>
        </div>

        <!-- 场景切换：像列车驶过不同的风景 -->
        <div class="scene-tabs">
          <button class="scene-btn is-active" data-index="0" type="button">黄金时刻</button>
          <button class="scene-btn" data-index="1" type="button">静谧水面</button>
          <button class="scene-btn" data-index="2" type="button">幽深森林</button>
          <button class="scene-btn" data-index="3" type="button">宁静黎明</button>
        </div>
      </div>

      <!-- 底部数据行 -->
      <div class="stats swap-color">
        <span>1 件参赛作品</span>
        <span class="stat-divider">|</span>
        <span>4700+ 行代码</span>
        <span class="stat-divider">|</span>
        <span>4 大古建场景</span>
        <span class="stat-divider">|</span>
        <span>∞ 好奇心</span>
      </div>
    </div>
  </section>

  <script>
    // 场景切换：切视频 + "幽深森林"场景文字变深色（保持可读）
    const videos = [...document.querySelectorAll(".bg-video")];
    const content = document.getElementById("content");
    let active = 0;
    let cooldown = false;

    function switchScene(index) {
      if (index === active || cooldown) return;
      active = index;
      cooldown = true;
      setTimeout(() => (cooldown = false), 1000); // 防连点，给淡入淡出留时间
      videos.forEach((video, i) => {
        video.classList.toggle("is-active", i === index);
        if (i === index) video.play().catch(() => {}); // 自动播放被拦时兜底
        else video.pause();
      });
      content.classList.toggle("is-dark", index === 2);
    }

    document.querySelectorAll(".scene-btn").forEach((btn) => {
      btn.addEventListener("click", () => switchScene(Number(btn.dataset.index)));
    });
  </script>
</body>
</html>
