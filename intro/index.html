<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 页面描述：显示在搜索引擎结果里，JS 启动后会自动用 config 里的内容更新它 -->
  <meta name="description" content="苦瓜大王的个人主页 —— 信息安全专业在校大学生，热爱用 AI Agent 解决实际问题。">
  <title>苦瓜大王 · 个人主页</title>

  <!-- 网站图标：内嵌 SVG，不需要额外图片文件，想换颜色改 fill 里的 %23FF005E -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23FF005E'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='%23fff' font-family='sans-serif'>苦</text></svg>">
  <!-- 浏览器地址栏主题色 -->
  <meta name="theme-color" content="#FF005E">
  <!-- 展示字体（与 Inner Circle 同款）：Michroma 点缀标题、Manrope 英文正文 -->
  <!-- media="print" + onload 技巧：字体加载失败也不会阻塞页面渲染 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Michroma&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <!-- 在页面渲染前先确定深色/浅色模式，避免打开时颜色闪烁 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ======================= 导航栏 ======================= -->
  <nav id="navbar">
    <div class="container nav-inner">
      <a href="#hero" class="logo mono" id="nav-logo"></a>
      <!-- 桌面端菜单（内容由 main.js 从 config.js 渲染） -->
      <ul class="nav-links" id="nav-links"></ul>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="切换深色/浅色模式">
          <!-- 太阳/月亮图标由 CSS 根据当前主题切换显示 -->
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="menu-toggle" class="icon-btn menu-btn" aria-label="打开菜单" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <!-- 手机端下拉菜单 -->
    <div class="mobile-menu" id="mobile-menu"></div>
  </nav>

  <!-- ======================= 首屏 Hero ======================= -->
  <header id="hero" class="hero">
    <div class="hero-blob blob-a" aria-hidden="true"></div>
    <div class="hero-blob blob-b" aria-hidden="true"></div>
    <canvas id="particles" aria-hidden="true"></canvas>
    <div class="container hero-content">
      <div class="avatar" id="avatar"></div>
      <p class="hero-greeting mono"></p>
      <h1 class="hero-name"></h1>
      <p class="hero-role"></p>
      <p class="hero-slogan"></p>
      <p class="hero-desc"></p>
      <div class="hero-tags mono" id="hero-tags"></div>
      <div class="hero-btns" id="hero-btns"></div>
    </div>
    <a class="scroll-down mono" href="#about" aria-label="向下滚动">SCROLL ↓</a>
  </header>

  <!-- 跑马灯滚筒：滚动进度驱动它转动（内容由 config.js 生成） -->
  <div class="marquee" aria-hidden="true">
    <div class="marquee-track" id="marquee-track"></div>
  </div>

  <main>
    <!-- ======================= 关于我 ======================= -->
    <section id="about" class="section">
      <div class="container">
        <div class="section-head reveal"></div>
        <div class="about-grid">
          <div class="about-text reveal" id="about-text"></div>
          <ul class="about-highlights reveal" id="about-highlights"></ul>
        </div>
      </div>
    </section>

    <!-- ======================= 技能 ======================= -->
    <section id="skills" class="section section-alt">
      <div class="container">
        <div class="section-head reveal"></div>
        <ul class="skills-grid" id="skills-list"></ul>
      </div>
    </section>

    <!-- ======================= 项目 / 作品 ======================= -->
    <section id="projects" class="section">
      <div class="container">
        <div class="section-head reveal"></div>
        <div class="projects-grid" id="projects-list"></div>
      </div>
    </section>

    <!-- ======================= 经历时间线 ======================= -->
    <section id="timeline" class="section section-alt">
      <div class="container">
        <div class="section-head reveal"></div>
        <ul class="timeline" id="timeline-list"></ul>
      </div>
    </section>

    <!-- ======================= 荣誉证书墙 ======================= -->
    <section id="honors" class="section section-alt">
      <div class="container">
        <div class="section-head reveal"></div>
        <div class="honors-grid" id="honors-list"></div>
      </div>
    </section>

    <!-- ======================= 联系我 ======================= -->
    <section id="contact" class="section">
      <div class="container">
        <div class="section-head reveal"></div>
        <div class="contact-grid" id="contact-list"></div>
      </div>
    </section>
  </main>

  <!-- ======================= 页脚 ======================= -->
  <footer class="footer">
    <div class="container">
      <p id="footer-text"></p>
    </div>
  </footer>

  <!-- 常驻操作条：滚过首屏后升起，核心按钮永远一键可达（内容由 config.js 生成） -->
  <div id="cta-bar" class="cta-bar"></div>

  <!-- 返回顶部按钮 -->
  <button id="back-to-top" aria-label="返回顶部">↑</button>

  <!-- 证书放大预览（灯箱）：点击带图证书卡片时打开 -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <figure class="lightbox-body">
      <img id="lightbox-img" src="" alt="">
      <figcaption id="lightbox-caption" class="mono"></figcaption>
    </figure>
    <button id="lightbox-close" aria-label="关闭预览">×</button>
  </div>

  <!-- 先加载内容配置，再加载渲染脚本（顺序不能反） -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
